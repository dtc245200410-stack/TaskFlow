services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--storage.tsdb.retention.time=7d','--storage.tsdb.retention.size=1GB']
    restart: unless-stopped
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9098}:9090']
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro',prometheus_data:/prometheus]
    networks: [monitoring,management]
    healthcheck:
      test: [CMD-SHELL,'wget -q -O - http://127.0.0.1:9090/-/ready >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 15
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ['127.0.0.1:${GRAFANA_PORT:-3008}:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring,management]
    healthcheck:
      test: [CMD-SHELL,'wget -q -O - http://127.0.0.1:3000/api/health >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 15
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://taskflow_monitor:${MONITOR_DB_PASSWORD:?Run scripts/init.ps1}@postgres:5432/${POSTGRES_DB:-taskflow}?sslmode=disable
    networks: [data,monitoring]
    depends_on:
      postgres: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ['--nginx.scrape-uri=http://nginx:8082/stub_status']
    restart: unless-stopped
    networks: [monitoring]
    depends_on:
      nginx: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    command: ['--docker_only=true','--housekeeping_interval=15s','--store_container_labels=true','--disable_metrics=advtcp,cpu_topology,hugetlb,referenced_memory,resctrl,sched,tcp,udp']
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
