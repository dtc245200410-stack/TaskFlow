server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: backend
    static_configs:
      - targets: [localhost]
        labels:
          job: taskflow
          service: backend
          __path__: /logs/backend/backend.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: taskflow
          service: nginx
          __path__: /logs/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339
  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: taskflow
          service: nginx-error
          __path__: /logs/nginx/error.log
