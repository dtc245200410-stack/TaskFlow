global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: backend
    static_configs: [{targets: ['backend:4000']}]
  - job_name: nginx
    static_configs: [{targets: ['nginx-exporter:9113']}]
  - job_name: postgres
    static_configs: [{targets: ['postgres-exporter:9187']}]
  - job_name: containers
    static_configs: [{targets: ['cadvisor:8080']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: loki
    static_configs: [{targets: ['loki:3100']}]
  - job_name: promtail
    static_configs: [{targets: ['promtail:9080']}]
